# Build statičnog sajta i postavljanje na Plesk (FTP) pri svakoj izmjeni na grani main
# (izmjene iz admin panela dolaze kao commitovi preko GitHub API-ja).
#
# Potrebne tajne (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Dok FTP_PASSWORD nije postavljen, sajt se samo builda (provjera), bez postavljanja na server.
name: Objava sajta

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jedna objava u isto vrijeme; nova izmjena čeka (ne prekida upload u toku)
concurrency:
  group: objava
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  objava:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FTP_ENABLED: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # WebP verzije slika i Next keš između objava (optimize-images preskače nepromijenjene slike)
      - uses: actions/cache@v4
        with:
          path: |
            public/_img
            .next/cache
          key: build-${{ github.run_id }}
          restore-keys: build-

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Objava na server (FTP)
        if: env.FTP_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Plesk ima samopotpisani certifikat → šifrovana veza bez provjere certifikata
          protocol: ftps
          security: loose
          local-dir: ./out/
          server-dir: ./httpdocs/
          # Ne dirati podatke admina na serveru (lozinka, token, sesije, slike na čekanju)
          exclude: |
            **/.git*
            **/.git*/**
            admin/_data/**
          timeout: 120000
